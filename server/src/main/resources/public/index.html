<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BugsWorld</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='19' rx='8' ry='10' fill='%232f6fde'/%3E%3Ccircle cx='16' cy='7' r='5' fill='%232f6fde'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="19" rx="8" ry="10" fill="#2f6fde"/><circle cx="16" cy="7" r="5" fill="#2f6fde"/><path d="M8 14 3 11M8 20H2M8 26l-5 3M24 14l5-3M24 20h6M24 26l5 3" stroke="#2f6fde" stroke-width="2"/></svg>
    BugsWorld
  </div>
  <span class="spacer"></span>
  <a id="live" class="button small" href="/watch" target="_blank" rel="noopener">Watch the simulation</a>
</header>

<main class="page narrow">
  <section class="card stack" aria-labelledby="title">
    <div>
      <h1 id="title">Submit your BL program</h1>
      <p class="muted" style="margin:6px 0 0">
        Upload the <code>.bl</code> file you wrote. It is checked right away; once it compiles,
        submit it and your professor will run it in the class simulation.
      </p>
    </div>

    <div class="fields two">
      <div class="field">
        <label for="student">Your name</label>
        <input id="student" type="text" maxlength="60" autocomplete="name" placeholder="e.g. Ann Smith">
      </div>
      <div class="field hidden" id="code-field">
        <label for="class-code">Class code</label>
        <input id="class-code" type="text" maxlength="40" autocomplete="off" placeholder="from your professor">
      </div>
    </div>

    <label id="drop" class="dropzone" for="file">
      <input id="file" type="file" accept=".bl,.txt" class="visually-hidden">
      <strong>Choose your .bl file</strong>
      <span class="muted">or drag it here</span>
    </label>

    <div id="checked" class="stack hidden" style="gap:12px">
      <div class="row">
        <strong id="file-name"></strong>
        <span id="status" class="pill" role="status"></span>
      </div>
      <div id="code"></div>
      <ul id="problems" class="problems" aria-label="Problems"></ul>
      <button id="submit" class="primary big">Submit</button>
      <div id="submit-result" class="notice hidden" role="status"></div>
    </div>
  </section>
</main>
<script type="module" src="/js/student.js"></script>
</body>
</html>
