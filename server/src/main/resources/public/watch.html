<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BugsWorld Simulation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='19' rx='8' ry='10' fill='%232f6fde'/%3E%3Ccircle cx='16' cy='7' r='5' fill='%232f6fde'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="watch">
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="19" rx="8" ry="10" fill="#2f6fde"/><circle cx="16" cy="7" r="5" fill="#2f6fde"/><path d="M8 14 3 11M8 20H2M8 26l-5 3M24 14l5-3M24 20h6M24 26l5 3" stroke="#2f6fde" stroke-width="2"/></svg>
    BugsWorld
  </div>
  <span id="status" class="pill hidden">Connecting…</span>
  <span id="tick" class="muted"></span>
  <span class="spacer"></span>
  <button id="fullscreen" class="small" title="Full screen (F)">Full screen</button>
</header>
<section id="login" class="card hidden" style="max-width:440px;margin:60px auto">
  <h2>Projector view</h2>
  <p class="muted">Only the professor can show the simulation. Open this view from the dashboard,
    or enter the instructor token shown in the window where BugsWorld is running.</p>
  <form id="login-form" class="stack" style="gap:12px">
    <div class="field">
      <label for="token">Instructor token</label>
      <input id="token" type="password" autocomplete="current-password" required>
    </div>
    <button class="primary big" type="submit">Show the simulation</button>
    <div id="login-error" class="notice err hidden" role="alert"></div>
  </form>
</section>
<main id="main" class="watch-main hidden">
  <div id="stage" class="world-wrap">
    <canvas id="world" class="world"></canvas>
    <div id="overlay" class="overlay hidden" role="status"></div>
  </div>
  <aside class="watch-side">
    <h2 class="muted">Programs</h2>
    <ul id="legend" class="legend big"></ul>
    <p id="empty" class="muted">No programs loaded yet.</p>
  </aside>
</main>
<script type="module" src="/js/watch.js"></script>
</body>
</html>
